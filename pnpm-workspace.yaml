packages:
  - apps/api
  - packages/contract

catalogMode: prefer
catalogPrune: true
saveExact: true
lockfile: true
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: false

catalog:
  "@commitlint/cli": 21.2.4
  "@lobehub/commitlint-config": 3.0.1
  "@types/node": 24.19.2
  knip: 6.45.0
  lint-staged: 16.4.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
  taze: 21.3.0
  typescript: 7.0.2
  ultracite: 8.1.1
  vitest: 5.1.0

catalogs:
  api:
    "@orpc/client": 2.0.0-beta.50
    "@orpc/contract": 2.0.0-beta.50
    "@orpc/openapi": 2.0.0-beta.50
    "@orpc/server": 2.0.0-beta.50
    "@orpc/zod": 2.0.0-beta.50
    tsdown: 0.23.7
    zod: 4.6.7
  contract:
    "@orpc/contract": 2.0.0-beta.50
    "@orpc/openapi": 2.0.0-beta.50
    zod: 4.6.7
minimumReleaseAgeExclude:
  - knip@6.45.0
