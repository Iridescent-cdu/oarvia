name: Auto Tag Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Merged release PR to recover, preserving its original merge SHA and version
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stable-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    environment: release-control
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')) ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/github-script@v8
        env:
          RECOVERY_PR: ${{ inputs.pull_number }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            let pullNumber;
            if (context.eventName === 'workflow_dispatch') {
              if (!/^[1-9]\d*$/.test(process.env.RECOVERY_PR ?? '')) throw new Error('Expected a PR number');
              pullNumber = Number(process.env.RECOVERY_PR);
              if (!Number.isSafeInteger(pullNumber)) throw new Error('Invalid PR number');
            }
            await publish({ github, context, core, pullNumber, expectedAppId: Number(process.env.RELEASE_APP_ID) });
