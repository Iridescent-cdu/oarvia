name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- bun run ci
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      DEPLOYMENT_HEALTH_URL: ${{ vars.DEPLOYMENT_HEALTH_URL }}
      EXPECTED_SHA: ${{ github.sha }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Validate target configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$WORKER_NAME"
          test -n "$DEPLOYMENT_HEALTH_URL"
      - run: mise exec -- bun run build:worker
      - name: Deploy worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mise exec -- pnpm exec wrangler deploy --env "$TARGET" --name "$WORKER_NAME" \
            --var "DEPLOYMENT_SHA:$EXPECTED_SHA" 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
      - name: Verify running revision
        run: mise exec -- node .github/scripts/verify-deployment.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: worker-deploy-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-deploy.log
          if-no-files-found: ignore
          retention-days: 14
