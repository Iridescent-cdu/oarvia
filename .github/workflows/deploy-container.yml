name: Deploy API

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: Existing stable release tag
        type: string
        required: true
      delivery_run:
        description: Successful Publish Docker Image run ID
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.target == 'production' && format('container-release-{0}', vars.REGISTRY_IMAGE) || 'deploy-api-staging' }}
  queue: max
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    outputs:
      image: ${{ steps.receipt.outputs.image }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        id: source
        with:
          script: |
            const { resolveDeployment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-source.mjs`);
            await resolveDeployment({ github, context, core });
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/receipt
          run-id: ${{ inputs.delivery_run }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v8
        id: receipt
        env:
          RECEIPT_DIR: ${{ runner.temp }}/receipt
          REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          DELIVERY_RUN: ${{ steps.source.outputs.run_id }}
          DELIVERY_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_PASSWORD: ${{ secrets.DEPLOY_REGISTRY_PASSWORD }}
        with:
          script: |
            const { verifyDeploymentReceipt } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-source.mjs`);
            await verifyDeploymentReceipt({ core });
  deploy:
    needs: check
    runs-on: [self-hosted, linux, deployment]
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      DEPLOY_IMAGE: ${{ needs.check.outputs.image }}
      EXPECTED_SHA: ${{ needs.check.outputs.sha }}
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      DEPLOY_TARGET: ${{ inputs.target }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      COMPOSE_FILE_PATH: docker-compose.production.yml
      COMPOSE_ENV_FILE: docker-compose.production.env
      IMAGE_VARIABLE: API_IMAGE
      COMPOSE_SERVICE: api
      IMAGE_REPOSITORY: ${{ vars.REGISTRY_IMAGE }}
      DEPLOYMENT_HEALTH_URL: ${{ vars.DEPLOYMENT_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy and verify API
        shell: bash
        env:
          DEPLOY_RESULT_FILE: ${{ runner.temp }}/api-deploy-${{ github.run_id }}-${{ github.run_attempt }}.txt
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_PASSWORD: ${{ secrets.DEPLOY_REGISTRY_PASSWORD }}
        run: bash .github/scripts/deploy-container.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-deploy-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-deploy-${{ github.run_id }}-${{ github.run_attempt }}.txt
          if-no-files-found: warn
          retention-days: 30
